media:
  input: public/media
  output: /media

content:
  - name: general
    label: Настройки сайта
    type: file
    path: content/general.yml
    fields:
      - { name: siteTitle,      label: Название усадьбы,         type: string }
      - { name: slogan,         label: Слоган,                   type: string }
      - { name: heroEyebrow,    label: Hero — надпись сверху,    type: string }
      - { name: heroTitle,      label: Hero — заголовок,         type: string }
      - { name: heroSubtitle,   label: Hero — подзаголовок,      type: text }
      - name: heroImages
        label: Hero — фотографии слайдера
        type: image
        list: true
      - { name: welcomeText,    label: Welcome — текст о нас,    type: text }
      - { name: weddingTitle,   label: Свадьбы — заголовок,      type: string }
      - { name: weddingText,    label: Свадьбы — текст,          type: text }
      - { name: phone1,         label: Телефон основной,         type: string }
      - { name: phone2,         label: Телефон доп.,             type: string }
      - { name: address,        label: Адрес,                    type: string }
      - { name: distanceMinsk,  label: Расстояние от Минска,     type: string }
      - { name: distanceVolozhyn, label: Расстояние от Воложина, type: string }
      - { name: instagram,      label: Instagram,                type: string }
      - { name: responseTime,   label: Время ответа,             type: string }
      - { name: pricePerNight,  label: Цена / чел. / ночь,       type: string }
      - { name: priceNewYear,   label: Цена новогодняя,          type: string }
      - { name: priceBanya,     label: Цена бани,                type: string }
      - { name: checkIn,        label: Заезд,                    type: string }
      - { name: checkOut,       label: Выезд,                    type: string }
      - { name: prepayment,     label: Предоплата,               type: string }
      - { name: cancellation,   label: Условие отмены,           type: string }

  - name: houses
    label: Домики и Баня
    type: collection
    path: content/houses
    extension: md
    fields:
      - { name: title,           label: Название,              type: string, primary: true }
      - { name: type,            label: "Тип (Дом / Баня)",    type: string }
      - { name: description,     label: Короткое описание,     type: text }
      - { name: fullDescription, label: Полное описание,       type: text }
      - { name: capacity,        label: Вместимость,           type: string }
      - { name: price,           label: Цена,                  type: string }
      - { name: image,           label: Главное фото,          type: image }
      - name: gallery
        label: Галерея домика
        type: image
        list: true
      - { name: order,           label: Порядок,               type: number, default: 0 }
      - { name: published,       label: Опубликовано,          type: boolean, default: true }

  - name: activities
    label: Активности
    type: collection
    path: content/activities
    extension: md
    fields:
      - { name: title,       label: Название,     type: string, primary: true }
      - { name: description, label: Описание,     type: text }
      - { name: image,       label: Фото,         type: image }
      - { name: order,       label: Порядок,      type: number, default: 0 }
      - { name: published,   label: Опубликовано, type: boolean, default: true }

  - name: reviews
    label: Отзывы гостей
    type: collection
    path: content/reviews
    extension: md
    fields:
      - { name: name,      label: Имя гостя,    type: string, primary: true }
      - { name: location,  label: Город,        type: string }
      - { name: text,      label: Текст отзыва, type: text }
      - { name: rating,    label: Рейтинг,      type: number, default: 5 }
      - { name: date,      label: Дата,         type: date }
      - { name: published, label: Опубликовано, type: boolean, default: true }

  - name: faq
    label: FAQ — Частые вопросы
    type: file
    path: content/faq.yml
    fields:
      - name: items
        label: Вопросы
        type: object
        list: true
        fields:
          - { name: question, label: Вопрос, type: string }
          - { name: answer,   label: Ответ,  type: text }

  - name: gallery
    label: Галерея
    type: file
    path: content/gallery.yml
    fields:
      - name: images
        label: Фотографии
        type: object
        list: true
        fields:
          - { name: src, label: URL фото, type: image }
          - { name: alt, label: Описание, type: string }

  - name: splavy
    label: Лендинг «Байдарки»
    type: file
    path: content/splavy.yml
    fields:
      - { name: heroEyebrow,   label: Hero — надпись сверху, type: string }
      - { name: heroTitle,     label: Hero — заголовок,      type: string }
      - { name: heroSubtitle,  label: Hero — подзаголовок,   type: text }
      - { name: heroImage,     label: Hero — фото,           type: image }
      - { name: heroButton,    label: Hero — кнопка,         type: string }
      - { name: introEyebrow,  label: Интро — надпись,       type: string }
      - { name: introTitle,    label: Интро — заголовок,     type: string }
      - { name: introText,     label: Интро — текст,         type: text }
      - name: facts
        label: Факты (цифры)
        type: object
        list: true
        fields:
          - { name: value, label: Значение, type: string }
          - { name: label, label: Подпись,  type: string }
      - name: offers
        label: Блоки (байдарки / баня / чан / питание)
        type: object
        list: true
        fields:
          - { name: eyebrow,   label: Надпись сверху,  type: string }
          - { name: title,     label: Заголовок,       type: string }
          - { name: text,      label: Описание,        type: text }
          - { name: image,     label: Фото,            type: image }
          - name: features
            label: Список преимуществ
            type: string
            list: true
          - { name: priceNote, label: Плашка цены,     type: string }
      - { name: pricesTitle, label: Цены — заголовок, type: string }
      - { name: pricesNote,  label: Цены — примечание, type: text }
      - name: prices
        label: Прайс
        type: object
        list: true
        fields:
          - { name: name,  label: Услуга,      type: string }
          - { name: price, label: Цена,        type: string }
          - { name: note,  label: Примечание,  type: string }
      - { name: galleryTitle, label: Галерея — заголовок, type: string }
      - name: gallery
        label: Галерея — фото
        type: object
        list: true
        fields:
          - { name: src, label: Фото,      type: image }
          - { name: alt, label: Описание,  type: string }
      - { name: ctaEyebrow, label: Заявка — надпись,   type: string }
      - { name: ctaTitle,   label: Заявка — заголовок, type: string }
      - { name: ctaText,    label: Заявка — текст,     type: text }
      - { name: phone1,     label: Телефон основной,   type: string }
      - { name: phone2,     label: Телефон доп.,       type: string }
      - { name: instagram,  label: Instagram,          type: string }
      - { name: address,    label: Адрес,              type: string }
      - { name: metaTitle,       label: SEO — title,       type: string }
      - { name: metaDescription, label: SEO — description, type: text }
