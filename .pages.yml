media:
  input: public/images
  output: /images

content:
  - name: houses
    label: Домики и Баня
    type: collection
    path: content/houses
    filename: "{fields.title}"
    extension: md
    fields:
      - name: title
        label: Название
        type: string
        required: true
      - name: type
        label: Тип
        type: select
        options:
          values: ["Дом", "Баня"]
      - name: description
        label: Короткое описание
        type: text
      - name: capacity
        label: Вместимость
        type: string
      - name: price
        label: Цена (от)
        type: string
      - name: order
        label: Порядок отображения
        type: number
        default: 0
      - name: published
        label: Опубликовано
        type: boolean
        default: true

  - name: activities
    label: Чем заняться
    type: collection
    path: content/activities
    filename: "{fields.title}"
    extension: md
    fields:
      - name: title
        label: Название активности
        type: string
      - name: description
        label: Описание
        type: text
      - name: icon
        label: Иконка (эмодзи)
        type: string
      - name: order
        label: Порядок
        type: number

  - name: reviews
    label: Отзывы гостей
    type: collection
    path: content/reviews
    filename: "{fields.name}"
    extension: md
    fields:
      - name: name
        label: Имя гостя
        type: string
      - name: text
        label: Текст отзыва
        type: text
      - name: location
        label: Город / Страна
        type: string
      - name: date
        label: Дата
        type: date
      - name: published
        label: Опубликовано
        type: boolean
        default: true

  - name: general
    label: Настройки сайта
    type: file
    path: content/general.yml
    fields:
      - name: siteTitle
        label: Название усадьбы
        type: string
        default: Поместье Русаково
      - name: phone
        label: Телефон
        type: string
      - name: email
        label: Email
        type: string
      - name: address
        label: Адрес
        type: string
      - name: whatsapp
        label: WhatsApp / Telegram
        type: string
      - name: heroSubtitle
        label: Описание на главной
        type: text
