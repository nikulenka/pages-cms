items:
  - question: "Во сколько заезд и выезд?"
    answer: "Заезд с 14:00, выезд до 12:00. Ранний заезд или поздний выезд — по согласованию."

  - question: "Нужна ли предоплата?"
    answer: "Да, 50% от стоимости. Возврат 100% при отмене за 2 недели."

  - question: "Сколько стоит аренда бани?"
    answer: "150 руб. за 4 часа — мобильная парилка + сибирский чан на дровах (до 8 человек)."

  - question: "Есть ли парковка?"
    answer: "Да, оборудованная парковка на 10 машин с видеонаблюдением. Входит в стоимость."

  - question: "Можно ли привезти питомца?"
    answer: "По предварительному согласованию с хозяевами."

  - question: "Есть ли Wi-Fi?"
    answer: "Да, Wi-Fi доступен на всей территории."

  - question: "До какого времени можно шуметь?"
    answer: "Громкая музыка — до 22:00."

  - question: "Как оплатить бронь?"
    answer: "Предоплата 50% при бронировании. Остаток — при заселении наличными или безналично по согласованию. Договор оформляется при заезде."
