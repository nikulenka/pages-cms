backend:
  name: github
  repo: nikulenka/pages-cms
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "houses"
    label: "Домики и Баня"
    folder: "content/houses"
    create: true
    extension: "md"
    slug: "{{slug}}"
    fields:
      - {label: "Название", name: "title", widget: "string", required: true}
      - {label: "Тип (Дом / Баня)", name: "type", widget: "select", options: ["Дом", "Баня"]}
      - {label: "Короткое описание", name: "description", widget: "text"}
      - {label: "Полное описание", name: "fullDescription", widget: "markdown"}
      - {label: "Вместимость", name: "capacity", widget: "string"}
      - {label: "Цена (от)", name: "price", widget: "string"}
      - {label: "Изображение (главное)", name: "image", widget: "image"}
      - {label: "Дополнительные фото", name: "gallery", widget: "list", fields: [{label: "Фото", name: "image", widget: "image"}]}
      - {label: "Порядок отображения", name: "order", widget: "number", default: 0}
      - {label: "Опубликовано", name: "published", widget: "boolean", default: true}

  - name: "activities"
    label: "Чем заняться"
    folder: "content/activities"
    create: true
    extension: "md"
    fields:
      - {label: "Название активности", name: "title", widget: "string"}
      - {label: "Короткое описание", name: "description", widget: "text"}
      - {label: "Иконка (эмодзи)", name: "icon", widget: "string"}
      - {label: "Порядок", name: "order", widget: "number"}

  - name: "reviews"
    label: "Отзывы гостей"
    folder: "content/reviews"
    create: true
    extension: "md"
    fields:
      - {label: "Имя гостя", name: "name", widget: "string"}
      - {label: "Текст отзыва", name: "text", widget: "text"}
      - {label: "Город / Страна", name: "location", widget: "string"}
      - {label: "Дата", name: "date", widget: "datetime"}
      - {label: "Опубликовано", name: "published", widget: "boolean", default: true}

  - name: "general"
    label: "Настройки сайта"
    files:
      - file: "content/general.yml"
        name: "contacts"
        label: "Контакты и информация"
        fields:
          - {label: "Название усадьбы", name: "siteTitle", widget: "string", default: "Поместье Русаково"}
          - {label: "Телефон", name: "phone", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Адрес", name: "address", widget: "string"}
          - {label: "WhatsApp / Telegram", name: "whatsapp", widget: "string"}
          - {label: "Короткое описание усадьбы", name: "heroSubtitle", widget: "text"}

      - file: "content/seo.yml"
        name: "seo"
        label: "SEO"
        fields:
          - {label: "Meta Description", name: "metaDescription", widget: "text"}
